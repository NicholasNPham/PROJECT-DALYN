# Copy to config.yaml and fill in. config.yaml is gitignored, never commit it.

# Microsoft Graph app registration. Identifiers only: the client secret lives
# in Windows Credential Manager. Run set_credentials.py once per machine.
graph:
  tenant_id: "PASTE-TENANT-ID"
  client_id: "PASTE-CLIENT-ID"

# Used only by check_graph.py: a real mailbox OUTSIDE the list below, to prove
# Exchange RBAC refuses it. Expect 200 while access is tenant-wide, 403 after
# the scope is applied. Leave blank to skip that check.
rbac_control_mailbox: ""

# Mailboxes DALYN is permitted to touch. Full SMTP addresses, not aliases.
#
# enabled is required on every entry and the enabled ones become the allowlist
# enforced in graph_client.py. A disabled mailbox is not reachable at all, not
# merely skipped, so this is where a mailbox is genuinely held back until its
# access is approved. Enable one at a time.
mailboxes:
  - address: "mailbox@example.com"
    enabled: false
  - address: "mailbox@example.com"
    enabled: true
  - address: "mailbox@example.com"
    enabled: false

# Which folder to read. Also hardcoded in graph_client.ALLOWED_FOLDERS as a
# second gate, so changing this alone will not move DALYN to the Inbox.
# Going to production requires a code change, on purpose.
source_folder: "deleteditems"

# Dry run: must stay true, this build refuses to start otherwise. What a dry
# run does to STAC and to the mailbox is set by the stac and mailbox_actions
# switches below.
dry_run: true

# What DALYN does to an email it handles. All four are required.
#
#   tag_enabled   Adds "DALYN: ..." Outlook categories, keeping any staff
#                 already set. Yellow while DALYN has the email (Queued,
#                 Processing, Saving), red when filed, green when a person
#                 needs to look. Creates the categories the first time and
#                 corrects their colors. Needs Mail.ReadWrite and
#                 MailboxSettings.ReadWrite.
#   move_enabled  After tagging, moves filed mail to done_folder. Mail a
#                 person must handle stays where it is, tagged green. Needs
#                 tag_enabled. Required when reading the Inbox with Save on.
#   skip_tagged   true skips any email with a red or green DALYN tag, which
#                 is how live running avoids filing an email twice. Clearing
#                 a green tag hands the email back to DALYN. false handles
#                 everything again every pass, for repeat testing.
#   done_folder   Required even while moving is off. Live: "deleteditems".
#                 Testing: "deleteditems/DALYN Completed", a folder made by
#                 hand inside Deleted Items, standing in for Deleted Items
#                 while Deleted Items stands in for the Inbox. DALYN never
#                 creates folders. graph_client.MOVE_TARGETS holds the list.
mailbox_actions:
  tag_enabled: false
  move_enabled: false
  skip_tagged: false
  done_folder: "deleteditems/DALYN Completed"

# Dry run window. Only mail received in the last N days is eligible.
days_back: 2

# Most emails one pass takes from EACH enabled mailbox, so three mailboxes
# at 10 is up to 30 a pass. Per mailbox so a busy one cannot leave the others
# unread. This is also the batch tagged Queued up front, so keep it small
# while staff share the folder. Live: 10. --limit lowers it for one run.
# Formerly max_messages, a total for all mailboxes; that name is refused.
max_messages_per_mailbox: 10

# Newest first for testing, since recent mail is what staff can still verify.
# Production reads oldest first.
newest_first: true

# STAC. Point this at TEST STAC until a live run is deliberately approved.
# is_test_instance is a second gate, the same idea as source_folder: DALYN
# checks the url looks like a test instance and refuses to save anything if
# this says true but the url does not. Set it to false only when a live run
# is intended, and expect to change code as well.
stac:
  url: "https://stac-test.example.com"
  # username and password live in Windows Credential Manager, not here.
  is_test_instance: true

  # Two switches, three stages. Work down the list.
  #
  #   upload_enabled: false, save_enabled: false
  #       Finds the case, checks the defendant, picks the Type/Subtype,
  #       then stops. Nothing is sent to STAC at all. Start here.
  #
  #   upload_enabled: true, save_enabled: false
  #       Also uploads the files and checks the Save button is there and
  #       ready, then refuses to press it. The files DO reach STAC's
  #       server, so only do this against test STAC.
  #
  #   upload_enabled: true, save_enabled: true
  #       Presses Save. Documents go onto cases.
  #
  # save_enabled without upload_enabled is refused: there would be nothing
  # to save.
  upload_enabled: false
  save_enabled: false

  # Attempts per email. A wedged Kendo dialog does not recover from another
  # click, so a retry closes Chrome and signs in again. Never applies once
  # Save has been pressed: that case goes to a person instead, because a
  # retry could file the same document twice. 1 disables retrying.
  max_attempts: 2

  # Seconds. Uploads are slow and the Kendo dialogs need a beat.
  wait_timeout: 10
  upload_timeout: 60

  # true closes Chrome and signs in again after every upload box, the way
  # PCSO911 does. Slower, roughly ten seconds a document, but every document
  # starts from a clean page and none of STAC's leftover state can carry
  # over. false reuses one browser for the whole pass, which is much faster
  # and relies on the page being left tidy.
  fresh_browser: true

  # Seconds to pause after each step, so a person can watch what the browser
  # is doing. 0 for normal running. 1 makes a pass roughly ten seconds per
  # document slower, which is fine while testing and not fine in production.
  action_pause: 0

  # Where an attachment goes when it has a good case number but matched no
  # rule: on the right case, under a code a person reviews inside STAC.
  #
  # Leave review_type and review_subtype out to use PLS RVW / PLS RVW, one
  # string with a space, in both columns. Test and live STAC both have it
  # (live enabled by the STAC admin, Oct 2026). check_types.py confirms it
  # against whichever export paths.stac_types points at.
  #
  # Set both only to point a test instance at some other pair. Anything other
  # than PLS RVW / PLS RVW is refused when is_test_instance is false, since a
  # stand-in code on live would file real filings where nobody looks.
  # review_type: "PLS RVW"
  # review_subtype: "PLS RVW"

# Paths, relative to the project root
paths:
  logs: "logs"
  temp: "temp"
  excel: "Path/to/DALYN.xlsx"
  # Export of STAC's active Type/Subtype pairs. Used to check the rules sheet
  # before a run, so a bad label is caught here and not one document at a
  # time inside STAC.
  stac_types: "Path/to/Image_Types_SubTypes.xlsx"
  # chromedriver.exe. Leave blank to let webdriver_manager fetch one.
  chromedriver: ""